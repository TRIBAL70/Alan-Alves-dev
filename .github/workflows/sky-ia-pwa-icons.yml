name: Atualizar icones SKY IA do app Android PWA

on:
  push:
    paths:
      - ".github/workflows/sky-ia-pwa-icons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Generate PNG icon sizes using exact current SKY IA image
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import re
          from pathlib import Path
          from PIL import Image

          svg_file = Path("public/assets/sky-ia-launch.svg")
          svg = svg_file.read_text(encoding="utf-8")
          match = re.search(r'data:image/webp;base64,([^"]+)', svg)
          if not match:
              raise RuntimeError("SKY IA art not found in SVG asset")
          with Image.open(io.BytesIO(base64.b64decode(match.group(1)))) as image:
              art = image.convert("RGB")
              if art.width != art.height:
                  raise RuntimeError("SKY IA image must be square")
              for size in (192, 512):
                  output = Path(f"public/assets/sky-ia-icon-{size}.png")
                  icon = art.resize((size, size), Image.Resampling.LANCZOS)
                  icon.save(output, format="PNG", optimize=True)
                  with Image.open(output) as confirmed:
                      if confirmed.size != (size, size):
                          raise RuntimeError("Invalid PNG dimensions")
                  print(output, output.stat().st_size, "bytes")
          manifest_path = Path("public/manifest.webmanifest")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest["id"] = "/"
          manifest["start_url"] = "/"
          manifest["background_color"] = "#030711"
          manifest["theme_color"] = "#030711"
          manifest["icons"] = [
              {"src": "/assets/sky-ia-icon-192.png?v=20261114c", "sizes": "192x192", "type": "image/png", "purpose": "any"},
              {"src": "/assets/sky-ia-icon-512.png?v=20261114c", "sizes": "512x512", "type": "image/png", "purpose": "any"},
              {"src": "/assets/sky-ia-launch.svg?v=20261114c", "sizes": "any", "type": "image/svg+xml", "purpose": "any"}
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print("Android PWA manifest validated with SKY IA PNG 192/512 and stable app ID.")
          PY
      - name: Commit new icons and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/sky-ia-icon-192.png public/assets/sky-ia-icon-512.png public/manifest.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m "fix(pwa): use SKY IA splash PNG icons on Android"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
