name: Gerar banner 4K - Alan Alves Acai

on:
  push:
    paths:
      - ".github/workflows/upscale-acai-portfolio-4k.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Prepare 4K image processing
        run: |
          python -m pip install --quiet --upgrade pillow pillow-avif-plugin
      - name: Generate genuine 3840 x 2160 image asset and update card
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter
          import pillow_avif
          source = Path("public/assets/acai-portfolio-2026.avif")
          target = Path("public/assets/acai-portfolio-4k.avif")
          if not source.exists():
              raise SystemExit(f"Missing source image: {source}")
          with Image.open(source) as img:
              art = img.convert("RGB")
              art = art.resize((3840, 2160), Image.Resampling.LANCZOS)
              art = art.filter(ImageFilter.UnsharpMask(radius=1.25, percent=110, threshold=2))
              art.save(target, format="AVIF", quality=72, speed=4)
          with Image.open(target) as verified:
              if verified.size != (3840, 2160):
                  raise SystemExit("Asset is not 4K UHD")
              print("4K asset verified:", target, verified.size, target.stat().st_size, "bytes")

          page = Path("src/components/site/HomeMain.tsx")
          html = page.read_text()
          old = 'src="/assets/acai-portfolio-2026.avif"'
          new = 'src="/assets/acai-portfolio-4k.avif?v=4k-20261105"'
          if old not in html and new not in html:
              raise SystemExit("Acai portfolio img not found in HomeMain.tsx")
          if old in html:
              html = html.replace(old, new, 1)
              img_alt = 'width={720} height={405}'
              context = html.index(new)
              width_pos = html.find(img_alt, context, context + 400)
              if width_pos != -1:
                  html = html[:width_pos] + 'width={3840} height={2160}' + html[width_pos+len(img_alt):]
              page.write_text(html)
              print("Portfolio card switched to 4K asset.")
          PY
      - name: Commit banner and card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/acai-portfolio-4k.avif src/components/site/HomeMain.tsx
          if ! git diff --cached --quiet; then
            git commit -m "fix(portfolio): serve verified 3840x2160 Acai artwork"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
